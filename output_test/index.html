<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converted Website from PSD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container-fluid page-shell" style="padding:0">
  <div class="psd-viewport" style="position:relative;width:100%;overflow:hidden">
    <div class="psd-stage">
      <div class="psd-canvas" style="position:relative;width:1200px;height:800px;margin:0 auto;background:#ffffff;overflow:hidden;transform-origin:top left">
<section class="psd-section psd-section-band" style="position:absolute;left:0px;top:0px;width:1200px;height:800px;box-sizing:border-box">
<img src="assets/images/image_1_background-base.png" alt="Background Base" class="background-base psd-item psd-image" style="position:absolute;left:0px;top:0px;width:1200px;height:800px;box-sizing:border-box;z-index:1;">
<h1 class="header-title-text psd-heading psd-heading">PSD2HTML AI Conversion Engine</h1>
<h2 class="sub-description-text psd-heading psd-heading">This is a sample website layout generated completely from programmatic PSD file coordinates.
The HTML texts are fully selectable, and graphics are exported as standalone PNG assets.</h2>
</section>
<section class="psd-section psd-section-band" style="position:absolute;left:450px;top:300px;width:600px;height:300px;box-sizing:border-box">
<img src="assets/images/image_2_indigo-circle-shape.png" alt="Indigo Circle Shape" class="indigo-circle-shape psd-item psd-image" style="position:absolute;left:450px;top:300px;width:300px;height:300px;box-sizing:border-box;z-index:1;">
<img src="assets/images/image_3_orange-accent-box.png" alt="Orange Accent Box" class="orange-accent-box psd-item psd-image" style="position:absolute;left:850px;top:450px;width:200px;height:100px;box-sizing:border-box;z-index:1;">
</section>
<section class="psd-section psd-section-band" style="position:absolute;left:100px;top:700px;width:301px;height:20px;box-sizing:border-box">
<h3 class="footer-text psd-heading psd-heading">Generated by PSD2HTML engine version 1.0.0</h3>
</section>

      </div>
    </div>
  </div>
</div>
<script src="assets/js/bootstrap.bundle.min.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
